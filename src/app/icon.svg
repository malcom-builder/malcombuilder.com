<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12" />
  
  <!-- Sutil glow de fondo para la letra -->
  <circle cx="256" cy="256" r="140" fill="rgba(255,255,255,0.05)" filter="url(#glow)" />

  <text x="256" y="280" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="800" letter-spacing="-8">
    m<tspan font-family="monospace" fill="#FFFFFF" font-weight="700">.</tspan>
  </text>
</svg>
